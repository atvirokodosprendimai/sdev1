<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="The address space: a tenant prefix followed by a hash, walked one byte per level down a 256-way trie whose fan-out is fixed and whose depth grows only where data is.">
  <title>The address space — static fan-out, dynamic depth</title>
  <desc>An entity and a tenant produce a key whose first two bytes are the tenant, unhashed, and whose remainder is a hash. Each level of the trie consumes one byte, so the fan-out is always 256 and the depth grows only under the prefixes that hold data.</desc>

  <rect x="0" y="0" width="900" height="560" fill="#FBFAF7"/>
  <rect x="0.5" y="0.5" width="899" height="559" fill="none" stroke="#DCD6C9"/>

  <text x="32" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#26241F">The address space</text>
  <text x="32" y="64" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#6E6759">256 is the fan-out of every node, not a count of machines. That distinction is the difference between a system that scales and one capped at 256.</text>

  <text x="32" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6E6759">entity</text>
  <text x="90" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#26241F">planet-7</text>
  <text x="32" y="126" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6E6759">tenant</text>
  <text x="90" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#26241F">7</text>

  <line x1="188" y1="116" x2="222" y2="116" stroke="#B4531F" stroke-width="1.6"/>
  <path d="M229 116 l-10 -5.5 v11 z" fill="#B4531F"/>

  <rect x="238" y="96" width="52" height="40" rx="4" fill="#F6E9E2" stroke="#DDB49C"/>
  <rect x="290" y="96" width="52" height="40" rx="4" fill="#F6E9E2" stroke="#DDB49C"/>
  <rect x="342" y="96" width="52" height="40" rx="4" fill="#EDEAF2" stroke="#B9B2CC"/>
  <rect x="394" y="96" width="52" height="40" rx="4" fill="#EDEAF2" stroke="#B9B2CC"/>
  <rect x="446" y="96" width="52" height="40" rx="4" fill="#EDEAF2" stroke="#B9B2CC"/>
  <rect x="498" y="96" width="52" height="40" rx="4" fill="#EDEAF2" stroke="#B9B2CC"/>
  <text x="264" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#A26A45">00</text>
  <text x="316" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#A26A45">07</text>
  <text x="368" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5F5A72">da</text>
  <text x="420" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5F5A72">71</text>
  <text x="472" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5F5A72">09</text>
  <text x="524" y="121" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5F5A72">15</text>
  <text x="562" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8A8375">… 32 bytes</text>

  <path d="M238 146 v10 h104 v-10" fill="none" stroke="#A26A45" stroke-width="1.2"/>
  <text x="290" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#A26A45">tenant — NOT hashed</text>
  <text x="290" y="188" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8A7F66">so a tenant owns a contiguous subtree</text>

  <path d="M342 146 v10 h208 v-10" fill="none" stroke="#6F6790" stroke-width="1.2"/>
  <text x="446" y="172" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6F6790">hash of the entity</text>
  <text x="446" y="188" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#736C86">so keys spread evenly inside that subtree</text>

  <line x1="32" y1="210" x2="868" y2="210" stroke="#E4DFD2"/>

  <text x="32" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6E6759">Each level consumes exactly one byte of the key:</text>

  <rect x="396" y="262" width="108" height="34" rx="5" fill="#F2EEE4" stroke="#C9C0AC"/>
  <text x="450" y="284" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26241F">root</text>

  <line x1="450" y1="296" x2="450" y2="316" stroke="#C9C0AC" stroke-width="1.2"/>
  <line x1="150" y1="316" x2="750" y2="316" stroke="#C9C0AC" stroke-width="1.2"/>
  <line x1="150" y1="316" x2="150" y2="330" stroke="#C9C0AC" stroke-width="1.2"/>
  <line x1="270" y1="316" x2="270" y2="330" stroke="#C9C0AC" stroke-width="1.2"/>
  <line x1="390" y1="316" x2="390" y2="330" stroke="#C9C0AC" stroke-width="1.2"/>
  <line x1="510" y1="316" x2="510" y2="330" stroke="#C9C0AC" stroke-width="1.2"/>
  <line x1="630" y1="316" x2="630" y2="330" stroke="#C9C0AC" stroke-width="1.2"/>
  <line x1="750" y1="316" x2="750" y2="330" stroke="#C9C0AC" stroke-width="1.2"/>

  <rect x="118" y="330" width="64" height="32" rx="4" fill="#F6E9E2" stroke="#B4531F" stroke-width="1.6"/>
  <text x="150" y="351" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#B4531F">0x00</text>
  <rect x="238" y="330" width="64" height="32" rx="4" fill="#FBFAF7" stroke="#C9C0AC"/>
  <text x="270" y="351" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8375">0x01</text>
  <rect x="358" y="330" width="64" height="32" rx="4" fill="#FBFAF7" stroke="#C9C0AC"/>
  <text x="390" y="351" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8375">0x02</text>
  <text x="510" y="351" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8375">· · ·</text>
  <rect x="598" y="330" width="64" height="32" rx="4" fill="#FBFAF7" stroke="#C9C0AC"/>
  <text x="630" y="351" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8375">0xfe</text>
  <rect x="718" y="330" width="64" height="32" rx="4" fill="#FBFAF7" stroke="#C9C0AC"/>
  <text x="750" y="351" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8375">0xff</text>

  <text x="806" y="351" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#8A7F66">256</text>
  <text x="806" y="365" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#8A7F66">always</text>

  <line x1="150" y1="362" x2="150" y2="382" stroke="#B4531F" stroke-width="1.4"/>
  <line x1="90" y1="382" x2="290" y2="382" stroke="#B4531F" stroke-width="1.4"/>
  <line x1="90" y1="382" x2="90" y2="396" stroke="#B4531F" stroke-width="1.4"/>
  <line x1="190" y1="382" x2="190" y2="396" stroke="#B4531F" stroke-width="1.4"/>
  <line x1="290" y1="382" x2="290" y2="396" stroke="#B4531F" stroke-width="1.4"/>

  <rect x="58" y="396" width="64" height="32" rx="4" fill="#FBFAF7" stroke="#C9C0AC"/>
  <text x="90" y="417" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8375">0x06</text>
  <rect x="158" y="396" width="64" height="32" rx="4" fill="#F6E9E2" stroke="#B4531F" stroke-width="1.6"/>
  <text x="190" y="417" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#B4531F">0x07</text>
  <rect x="258" y="396" width="64" height="32" rx="4" fill="#FBFAF7" stroke="#C9C0AC"/>
  <text x="290" y="417" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8375">0x08</text>

  <line x1="190" y1="428" x2="190" y2="452" stroke="#B4531F" stroke-width="1.4"/>
  <path d="M190 459 l-5.5 -10 h11 z" fill="#B4531F"/>
  <rect x="118" y="462" width="144" height="34" rx="5" fill="#B4531F"/>
  <text x="190" y="484" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#FBFAF7">leaf 2:0007</text>

  <rect x="360" y="396" width="492" height="100" rx="6" fill="#E9EFEC" stroke="#A9C4B9"/>
  <text x="378" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#26241F">Static fan-out, dynamic depth</text>
  <text x="378" y="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4E6B61">Every node has 256 slots — that is fixed in the format and never changes.</text>
  <text x="378" y="458" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4E6B61">Depth grows ONLY under a prefix that holds data, one byte at a time, up to 32.</text>
  <text x="378" y="480" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4E6B61">So a hot tenant is absorbed by splitting deeper, and the ceiling is 256³² leaves —</text>
  <text x="378" y="494" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#4E6B61">not 256 machines.</text>

  <text x="32" y="530" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A7F66">A leaf identifier is written depth:prefix — so 2:0007 is “two bytes deep, under 00 07”. Below the tenant prefix depth, tenants share leaves; above it they never do.</text>
</svg>
